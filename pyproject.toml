[project]
name = "rmi-stitch-core"
version = "0.2.0.dev2"
description = "Core functionality for the Stitch platform."
readme = "README.md"
authors = [{ name = "Michael Barlow", email = "mbarlow@rmi.org" }]
requires-python = ">=3.12"
dependencies = ["pydantic>=2.14.3"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["stitch.core"]

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.3", "ty>=0.0.97"]

[tool.ruff]
extend-exclude = ["_exclude"]
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "TID",
  "SLF",
  "TC",
  "PLC0415",
  "PLE0604",
  "PLE0605",
  "RUF022",
  "RUF068",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at runtime, so names used in them must be
# imported at runtime too. Ruff does not follow inheritance across modules, so
# this project's own model bases are listed alongside `pydantic.BaseModel`.
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "stitch.core.models.Resource",
  "stitch.core.models.Resource_",
  "stitch.core.models.Source",
  "stitch.core.models.SourcePayload",
  "stitch.core.models.SourceView",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short", "--import-mode=importlib"]
