id: conditional-import-placement
language: python
severity: error
message: "I5: a conditional import block must sit at the top of the module, before any other code."
files: [src/stitch/**/*.py]
rule:
  any: [{ kind: if_statement }, { kind: try_statement }]
  inside: { kind: module }
  has:
    stopBy: end
    any: [{ kind: import_statement }, { kind: import_from_statement }]
  follows:
    stopBy: end
    not:
      any:
        - { kind: import_statement }
        - { kind: import_from_statement }
        - { kind: if_statement }
        - { kind: try_statement }
        - { kind: comment }
        - { kind: expression_statement, has: { kind: string } }
