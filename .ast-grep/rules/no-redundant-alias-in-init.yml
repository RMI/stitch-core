id: no-redundant-alias-in-init
language: python
severity: error
message: "D1: list the re-export in `__all__` instead of aliasing a name to itself."
files: [src/stitch/**/__init__.py]
rule:
  kind: aliased_import
  all:
    - { has: { field: name, pattern: $N } }
    - { has: { field: alias, pattern: $N } }
