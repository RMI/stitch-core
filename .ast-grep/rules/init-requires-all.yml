id: init-requires-all
language: python
severity: error
message: "D1: an `__init__.py` that imports must declare `__all__` listing its re-exports."
files: [src/stitch/**/__init__.py]
rule:
  kind: module
  has:
    stopBy: end
    any: [{ kind: import_statement }, { kind: import_from_statement }]
  not:
    has: { stopBy: end, pattern: __all__ = $_ }
