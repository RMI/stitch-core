#:schema https://mise.jdx.dev/schema/mise.json

[tools]
python = "3.12"
uv = "latest"
ast-grep = "0.51.1"
sd = "latest"

[vars]
package_name = "stitch-core"
package_root = "{{ config_root }}/src/stitch/core"

# --------------------
# Tasks
# --------------------

[tasks.build]
description = "Build `{{ vars.package_name }}` python package."
run = "uv build"

[tasks.lint]
description = "Run the ruff linter."
run = "uv run ruff check"

[tasks.typecheck]
description = "Run the `ty` type checker."
run = "uv run ty check"

[tasks."lint:imports"]
description = "Check import form rules with ast-grep."
run = "ast-grep scan"

[tasks."lint:structure"]
description = "Check package directory layout."
run = 'uv run python scripts/check_layout.py "{{ vars.package_root }}"'


[tasks.check]
description = "Lint, check imports and layout, and typecheck."
depends = ["lint", "lint:imports", "lint:structure", "typecheck", "test"]

[tasks.format]
description = "Sort imports and run the ruff formatter."
run = ["uv run ruff check --select I --fix", "uv run ruff format"]

[tasks.test]
description = "Run unit tests with pytest"
run = "uv run pytest"

[tasks."version:set"]
alias = "v:set"
usage = '''
arg "<version>" help="The full version to set."
'''
run = "uv version {{ usage.version }} --no-sync"

[tasks."version:bump"]
alias = "v:b"
usage = '''
arg "<parts>" var=#true { choices "major" "minor" "patch" "alpha" "beta" "rc" "dev" }
'''
run = 'uv version --bump {{ usage.parts | join(sep=" --bump ") }} --no-sync'

[tasks."version:commit"]
alias = "v:c"
description = "Commit the version and lockfile changes."
run = '''
git commit --only -m "chore(release): v$(uv version --short)" -- pyproject.toml uv.lock
'''

[tasks."git:tag"]
description = "Tag the committed version."
run = '''
set -e
test -z "$(git status --porcelain)"
version="$(uv version --short)"
git tag -a "v$version" -m "Release v$version"
'''

[tasks."release:prepare"]
description = "Bump the version, commit it, and create a local tag."
usage = '''
arg "<parts>" var=#true { choices "major" "minor" "patch" "alpha" "beta" "rc" "dev" }
'''
run = [
  'test -z "$(git status --porcelain)"',
  'mise run version:bump {{ usage.parts | join(sep=" ") }}',
  { task = "version:commit" },
  { task = "git:tag" },
]
