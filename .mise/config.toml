[tools]
python = "3.12"
uv = "latest"
ast-grep = "0.51.1"

[vars]
package_name = "stitch-core"
package_root = "{{ config_root }}/src/stitch"

# --------------------
# Tasks
# --------------------

[tasks.build]
description = "Build `{{ vars.package_name }}` python package."
run = "uv build"

[tasks.lint]
description = "Run the ruff linter."
run = "uv run ruff check"

[tasks.typecheck]
description = "Run the `ty` type checker."
run = "uv run ty check"

[tasks."lint:imports"]
description = "Check import form rules with ast-grep."
run = "ast-grep scan"

[tasks.check]
description = "Lint, check imports and layout, and typecheck."
depends = ["lint", "lint:imports", "lint:structure", "typecheck"]

[tasks.format]
description = "Run the ruff formatter."
run = "uv run ruff format"

[tasks.test]
description = "Run unit tests with pytest"
run = "uv run pytest"

[tasks."version:set"]
alias = "v:set"
usage = '''
arg "<version>" help="The full version to set."
'''
run = "uv version {{ usage.version }}"

[tasks."workspace:packages"]
description = "List workspace package names, including the root"
alias = "ws:pkg"
run = '''
#!/usr/bin/env bash
set -euo pipefail
uv workspace metadata --frozen -q | jq -r '.members[].name'
'''
